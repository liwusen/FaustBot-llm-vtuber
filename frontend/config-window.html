<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FaustBot 配置中心</title>
  <link rel="stylesheet" href="./config-window.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>配置</h1>
        <p>FaustBot 配置中心</p>
      </div>
      <nav id="moduleNav" class="module-nav" aria-label="配置模块"></nav>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-left">
          <span id="validBadge" class="badge badge-valid">有效</span>
          <span id="dirtyBadge" class="badge badge-dirty hidden">0 项配置已修改</span>
        </div>
        <div class="topbar-actions">
          <button id="reloadBtn" class="btn btn-ghost" type="button">重新加载</button>
          <button id="saveBtn" class="btn btn-primary" type="button">保存</button>
          <button id="applyBtn" class="btn btn-secondary" type="button">应用</button>
        </div>
      </header>

      <section id="banner" class="banner hidden" role="status" aria-live="polite"></section>

      <section class="content-head">
        <h2 id="moduleTitle">配置</h2>
        <p id="moduleDesc">在此模块中管理配置项。</p>
      </section>

      <section id="cardsRoot" class="cards-root">
        <article class="card full-span" id="bootPlaceholder">
          <h3 class="card-title">配置中心启动中</h3>
          <p class="card-help">正在连接后端并加载配置，请稍候。</p>
        </article>
      </section>
    </main>
  </div>
  <script src="./libs/configer/constants.js"></script>
  <script src="./libs/configer/dom-utils.js"></script>
  <script src="./libs/configer/modal.js"></script>
  <script src="./libs/codemirror/codemirror-bundle.js"></script>
  <script src="./libs/configer/codemirror-editor.js"></script>
  <script src="./libs/configer/state-core.js"></script>
  <script src="./libs/configer/ui-cards.js"></script>
  <script src="./libs/configer/list-utils.js"></script>
  <script src="./libs/configer/kb-utils.js"></script>
  <script src="./libs/configer/field-render.js"></script>
  <script src="./libs/configer/deeplink.js"></script>
  <script src="./libs/configer/kb-editor.js"></script>
  <script src="./libs/configer/kb-search.js"></script>
  <script src="./libs/configer/tts-voice.js"></script>
  <script src="./libs/configer/trigger-utils.js"></script>
  <script src="./libs/configer/trigger-editor.js"></script>
  <script src="./libs/configer/araya-slider.js"></script>
  <script src="./libs/configer/skill-utils.js"></script>
  <script src="./libs/configer/graph-renderer.js"></script>
  <script src="./libs/configer/modules/agent.js"></script>
  <script src="./libs/configer/modules/memory.js"></script>
  <script src="./libs/configer/modules/araya.js"></script>
  <script src="./libs/configer/modules/runtime.js"></script>
  <script src="./libs/configer/modules/triggers.js"></script>
  <script src="./libs/configer/modules/skills.js"></script>
  <script src="./libs/configer/modules/plugins.js"></script>
  <script src="./libs/configer/modules/components.js"></script>
  <script src="./libs/configer/modules/mcp.js"></script>
  <script src="./libs/configer/modules/overview.js"></script>
  <script src="./config-window.js"></script>
</body>
</html>
