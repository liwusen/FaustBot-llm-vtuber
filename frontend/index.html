<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Faust Live2d</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="libs/ui-icons.css">
  <link rel="stylesheet" href="styles_log_panel.css">
  <link rel="stylesheet" href="styles_layout_side_panel.css">
</head>
<body>
  <div id="app">
    <div id="overlay">正在初始化 Live2D…</div>
    <input id="modelPath" type="hidden" value="2D/hiyori_pro_zh/hiyori_pro_t11.model3.json" />
    <input id="clickThrough" type="checkbox" hidden checked />
    <input id="modelScaleSlider" type="range" min="0.1" max="2.0" step="0.05" value="0.3" hidden />
    <span id="modelScaleValue" hidden>0.30x</span>
    <input id="audioFile" type="file" accept="audio/*" hidden />
    <textarea id="ttsText" hidden></textarea>
    <select id="ttsLang" hidden>
      <option value="zh" selected>中文</option>
      <option value="en">英文</option>
    </select>
    <button id="loadBtn" hidden>加载模型</button>
    <button id="resetBtn" hidden>重置位置</button>
    <button id="playAudio" hidden>播放</button>
    <button id="stopAudio" hidden>停止</button>
    <button id="ttsBtn" hidden>TTS</button>
    <button id="startAsrBtn" hidden>启动ASR</button>
    <button id="stopAsrBtn" hidden disabled>停止ASR</button>
    <div id="statusDock" aria-hidden="true">
      <span class="status-item">
        <svg class="ui-icon status-icon" width="13" height="13"><use href="#i-mic"/></svg>
        <span id="asrStatus" class="status-text">未启动</span>
      </span>
      <span class="status-item">
        <svg class="ui-icon status-icon" width="13" height="13"><use href="#i-chat"/></svg>
        <span id="chatStatus" class="status-text">聊天未连接</span>
      </span>
      <span class="status-item">
        <svg class="ui-icon status-icon" width="13" height="13"><use href="#i-speaker"/></svg>
        <span id="ttsStatus" class="status-text">未合成</span>
      </span>
      <span class="status-item">
        <svg class="ui-icon status-icon" width="13" height="13"><use href="#i-wave"/></svg>
        <progress id="vadProb" value="0" max="1"></progress>
        <span id="vadProbLabel">0%</span>
      </span>
    </div>
    <div id="asrBubble" data-source="ai">
      <div id="asrText"></div>
      <div id="subagentSummary" style="display:none;"></div>
      <button id="hideAsrBubbleBtn" type="button" aria-label="隐藏返回结果" title="隐藏返回结果">×</button>
    </div>
    <div id="modelQuickController" aria-label="模型快捷控制器">
      <button id="quickToggleAsr" type="button" title="启动/停止语音识别">
        <span class="qc-icon" aria-hidden="true"><svg class="ui-icon" width="16" height="16"><use href="#i-mic"/></svg></span>
        <span class="qc-label">语音识别</span>
      </button>
      <button id="quickStopBtn" type="button" title="停止播放并中断生成 (Ctrl+Alt+S / Ctrl+Alt+X)">
        <span class="qc-icon" aria-hidden="true"><svg class="ui-icon" width="16" height="16"><use href="#i-stop"/></svg></span>
        <span class="qc-label">停止</span>
      </button>
      <button id="quickRandomMotion" type="button" title="随机播放动作">
        <span class="qc-icon" aria-hidden="true"><svg class="ui-icon" width="16" height="16"><use href="#i-spark"/></svg></span>
        <span class="qc-label">随机动作</span>
      </button>
      <button id="trayToggleBtn" type="button" title="隐藏到任务托盘">
        <span class="qc-icon" aria-hidden="true"><svg class="ui-icon" width="16" height="16"><use href="#i-tray"/></svg></span>
        <span class="qc-label">收进托盘</span>
      </button>
      <button id="openConfigBtn" type="button" title="打开配置中心">
        <span class="qc-icon" aria-hidden="true"><svg class="ui-icon" width="16" height="16"><use href="#i-gear"/></svg></span>
        <span class="qc-label">配置</span>
      </button>
      <button id="openLiveBtn" type="button" title="打开直播控制台">
        <span class="qc-icon" aria-hidden="true"><svg class="ui-icon" width="16" height="16"><use href="#i-broadcast"/></svg></span>
        <span class="qc-label">直播</span>
      </button>
      <button id="openVRMConfigBtn" type="button" title="VRM 配置" style="display:none;">
        <span class="qc-icon" aria-hidden="true"><svg class="ui-icon" width="16" height="16"><use href="#i-gamepad"/></svg></span>
        <span class="qc-label">VRM</span>
      </button>
      <button id="quickEditLayoutBtn" type="button" title="编辑 UI 布局 (Ctrl+Shift+E)">
        <span class="qc-icon" aria-hidden="true"><svg class="ui-icon" width="16" height="16"><use href="#i-layout"/></svg></span>
        <span class="qc-label">布局</span>
      </button>
    </div>
  </div>
  <!-- 日志面板（在 #app 外，避免点击穿透影响） -->
  <div id="logPanel" class="floating-panel" style="display:none;">
    <div class="floating-panel-header">
      <span class="log-title"><svg class="ui-icon" width="14" height="14"><use href="#i-doc"/></svg>后端日志</span>
      <div class="log-controls">
        <select id="logLevelFilter">
          <option value="0">全部级别</option>
          <option value="20">INFO+</option>
          <option value="30">WARNING+</option>
          <option value="40">ERROR+</option>
          <option value="50">CRITICAL</option>
        </select>
        <button id="logClearBtn" type="button" title="清除日志" aria-label="清除日志"><svg class="ui-icon" width="13" height="13"><use href="#i-trash"/></svg></button>
        <button id="logCloseBtn" type="button" title="关闭日志面板" aria-label="关闭日志面板"><svg class="ui-icon" width="13" height="13"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <pre id="logContent"><div class="log-placeholder">等待后端日志…</div></pre>
  </div>
  <div id="textChatBar">
    <div id="textChatAttachments"></div>
    <textarea id="textChatInput" rows="1" placeholder="输入内容，/ 调用指令"></textarea>
    <div id="textChatBarFooter">
      <button id="textChatAttachBtn" type="button" title="添加附件" aria-label="添加附件">
        <svg class="composer-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M10 4.4v11.2M4.4 10h11.2" />
        </svg>
      </button>
      <span id="textChatHint">Enter 发送 · Shift+Enter 换行</span>
      <span id="contextMeter" hidden>
        <span id="contextMeterText">— / 128K</span>
      </span>
      <button id="textChatSendBtn" type="button" title="发送" aria-label="发送" disabled>
        <svg class="composer-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M10 15.6V4.4M4.8 9.6 10 4.4l5.2 5.2" />
        </svg>
      </button>
    </div>
  </div>

  <div id="vrmConfigPanel" class="floating-panel" style="display:none;">
    <div class="floating-panel-header">
      <span>VRM 配置</span>
      <div class="vrm-config-actions">
        <button id="vrmConfigResetBtn" type="button" title="恢复默认">↺</button>
        <button id="vrmConfigSaveBtn" type="button" title="保存">保存</button>
        <button id="vrmConfigCloseBtn" type="button" title="关闭" aria-label="关闭"><svg class="ui-icon" width="13" height="13"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div id="vrmConfigPanelBody" class="vrm-config-body"></div>
  </div>

  <div id="subagentPanel" class="floating-panel" role="dialog" aria-label="子代理详情" style="display:none;">
    <div id="subagentPanelHeader" class="floating-panel-header">
      <div class="subagent-panel-heading">
        <span id="subagentPanelTitle">子代理</span>
        <span id="subagentPanelStatus" class="subagent-status" data-status="idle" hidden><i></i>空闲</span>
      </div>
      <div class="vrm-config-actions">
        <button id="subagentRemoveBtn" type="button" title="停止并移除当前子代理" disabled>
          <svg class="ui-icon" width="12" height="12"><use href="#i-trash"/></svg><span>移除</span>
        </button>
        <button id="subagentPanelCloseBtn" type="button" title="关闭" aria-label="关闭"><svg class="ui-icon" width="13" height="13"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div id="subagentPanelBody" class="vrm-config-body"></div>
  </div>

    <div id="toastContainer"></div>

    <!-- 引入 Live2D 依赖（Cubism 2 core 已移除：本仓库模型全部为 Cubism 4） -->
    <script src="libs/live2dcubismcore.min.js"></script>
    <script src="libs/pixi-live2d.bundle.js"></script>
    <script src="libs/soullink.bundle.js"></script>
    <script src="libs/markdown/markdown-bundle.js"></script>
    <script src="./libs/tts-splitter.js"></script>
    <script src="libs/ui-icons.js"></script>
    <script src="app.js" type="module"></script>
</body>
</html>
