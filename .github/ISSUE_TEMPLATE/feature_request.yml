name: 功能建议
description: 为 FaustBot 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望实现的功能。
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 这个建议想解决什么问题？现在有什么不便？
      placeholder: "我希望能够 ... 因为 ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你希望的功能或交互方式。
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 相关模块
      options:
        - 后端 (FastAPI / Agent)
        - 前端 (Electron / Live2D / VRM)
        - 语音 (VAD / ASR / TTS)
        - 记忆 (向量 / 知识图谱 / BM25)
        - 插件系统
        - 安装 / 打包
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法（可选）。
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复的建议。
          required: true
