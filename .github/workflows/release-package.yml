name: Release Package

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  build-and-draft-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache backend runtime (.runtime)
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: .runtime
          key: runtime-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            runtime-

      - name: Install cloud runtime and dependencies
        shell: cmd
        run: setup-runtime.bat --torch cpu --tts no --source official --install-python yes --install-node yes --install-bundle-node yes

      - name: Verify bundled Node.js runtime
        shell: pwsh
        run: |
          $nodeExe = Join-Path $env:GITHUB_WORKSPACE '.nodejs\node.exe'
          if (-not (Test-Path $nodeExe)) {
            throw ".nodejs\node.exe not found - bundled Node.js runtime is missing"
          }
          & $nodeExe --version

      - name: Create version.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^[Vv]', ''
          $content = @{ version = $ver; tag = $tag } | ConvertTo-Json -Compress
          $path = Join-Path $env:GITHUB_WORKSPACE 'backend\version.json'
          Set-Content -LiteralPath $path -Value $content -Encoding utf8
          Write-Host "Created $path : $content"

      - name: Remove embedded Python zip
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE '.runtime/python-embed.zip'
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

      - name: Download VAD model
        shell: cmd
        run: .runtime\python.exe -X utf8 embedded_python_bootstrap.py backend\faust_backend\download_vad.py

      - name: Download Live2D models
        shell: cmd
        run: .runtime\python.exe -X utf8 embedded_python_bootstrap.py frontend\live2d_downloader.py

      - name: Install frontend dependencies and bundle VRM renderer
        shell: cmd
        working-directory: frontend
        run: npm install && npx esbuild vrm-renderer.js --bundle --format=esm --outfile=libs/vrm-renderer.bundle.js --minify --log-level=warning

      - name: Package frontend
        shell: cmd
        working-directory: frontend
        run: npm run package

      - name: Copy win-unpacked into frontend root
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'frontend/dist/win-unpacked'
          $targetDir = Join-Path $env:GITHUB_WORKSPACE 'frontend'

          if (-not (Test-Path $sourceDir)) {
            throw "win-unpacked output not found: $sourceDir"
          }

          Get-ChildItem -LiteralPath $sourceDir -Force | ForEach-Object {
            $targetPath = Join-Path $targetDir $_.Name
            if (Test-Path $targetPath) {
              Remove-Item $targetPath -Recurse -Force
            }
            Copy-Item -LiteralPath $_.FullName -Destination $targetPath -Recurse -Force
          }

          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'frontend/dist') -Recurse -Force

      - name: Package mc-operator
        shell: cmd
        working-directory: backend\minecraft\mc-operator
        run: npm run package

      - name: Remove node_modules and dist before packaging
        shell: pwsh
        run: |
          @(
            'frontend/node_modules',
            'frontend/dist',
            'backend/__pycache__'
          ) | ForEach-Object {
            $p = Join-Path $env:GITHUB_WORKSPACE $_
            if (Test-Path $p) {
              Remove-Item -LiteralPath $p -Recurse -Force
              Write-Host "Removed: $_"
            }
          }

      - name: Prepare release archives
        id: prepare_archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stageDir = Join-Path $env:RUNNER_TEMP "faust-$tag-windows"
          $liteDir = Join-Path $env:RUNNER_TEMP "faust-$tag-windows-lite"
          $fullArchive = Join-Path $env:RUNNER_TEMP "faust-$tag-windows.zip"
          $liteArchive = Join-Path $env:RUNNER_TEMP "faust-$tag-without-runtime.zip"

          if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force }
          if (Test-Path $liteDir) { Remove-Item $liteDir -Recurse -Force }
          if (Test-Path $fullArchive) { Remove-Item $fullArchive -Force }
          if (Test-Path $liteArchive) { Remove-Item $liteArchive -Force }

          New-Item -ItemType Directory -Path $stageDir | Out-Null

          $excludeDirs = @('.git', '.github','.devin','.vscode','faust_plugin_market','tests')
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Where-Object {
            $excludeDirs -notcontains $_.Name
          } | ForEach-Object {
            $target = Join-Path $stageDir $_.Name
            Copy-Item -LiteralPath $_.FullName -Destination $target -Recurse -Force
          }

          if (-not (Test-Path (Join-Path $stageDir '.nodejs\node.exe'))) {
            throw ".nodejs\node.exe missing from release stage directory"
          }

          # Full archive (includes .runtime)
          Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $fullArchive -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($fullArchive)
          try {
            $hasNode = $zip.Entries | Where-Object { $_.FullName -like '.nodejs/*' } | Select-Object -First 1
            if (-not $hasNode) { throw ".nodejs missing from full release archive" }
          } finally {
            $zip.Dispose()
          }

          # Lite archive: copy stage, remove .runtime, then compress
          Copy-Item -LiteralPath $stageDir -Destination $liteDir -Recurse -Force
          $runtimeDir = Join-Path $liteDir '.runtime'
          if (Test-Path $runtimeDir) {
            Remove-Item -LiteralPath $runtimeDir -Recurse -Force
          }
          Compress-Archive -Path (Join-Path $liteDir '*') -DestinationPath $liteArchive -CompressionLevel Optimal

          "full_archive=$fullArchive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "lite_archive=$liteArchive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.prepare_archive.outputs.full_archive }}
            ${{ steps.prepare_archive.outputs.lite_archive }}

      - name: Authenticate with ModelScope
        shell: cmd
        run: .runtime\Scripts\modelscope.exe login --token %MODELSCOPE_TOKEN%
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}

      - name: Ensure ModelScope repository exists
        shell: pwsh
        run: |
          .\.runtime\Scripts\modelscope.exe create --repo-type dataset --exist-ok `
            --description "FaustBot release archives (latest only)" `
            allenlee18/FaustBotCore

      - name: Upload release archives to ModelScope (latest only)
        shell: pwsh
        run: |
          $full = "${{ steps.prepare_archive.outputs.full_archive }}"
          $lite = "${{ steps.prepare_archive.outputs.lite_archive }}"
          $verFile = Join-Path $env:GITHUB_WORKSPACE 'backend\version.json'
          $ms = '.\.runtime\Scripts\modelscope.exe'
          & $ms upload --repo-type dataset --sync --commit-message "Release ${{ github.ref_name }}" `
            allenlee18/FaustBotCore $full
          & $ms upload --repo-type dataset --sync --commit-message "Release ${{ github.ref_name }} (lite)" `
            allenlee18/FaustBotCore $lite
          & $ms upload --repo-type dataset --sync --commit-message "Release ${{ github.ref_name }} (version)" `
            allenlee18/FaustBotCore $verFile version.json