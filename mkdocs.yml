site_name: FaustBot 文档
site_description: FaustBot 文档
site_url: https://faustbot.readthedocs.io/
repo_url: https://github.com/liwusen/FaustBot-llm-vtuber
repo_name: FaustBot-llm-vtuber

theme:
  name: mkdocs
  language: zh
  palette:
    primary: blue
    accent: blue

nav:
  - 首页: index.md
  - 基础:
    - 项目介绍: getting-started.md
    - 安装指南: installation.md
    - 配置说明: configuration.md
  - 概念:
    - Agent 基础: agent-basics.md
  - 进阶:
    - MCP: mcp.md
    - 开发者环境: devinstall.md
    - 插件开发指南: create-plugin-guide.md
    - 插件 API Reference: plugin-api-reference.md
    - Processor 机制: processor.md
  - 语音配置:
    - GPT-Sovits: tts.md
    - FunASR: funasr.md

markdown_extensions:
  - tables
  # superfences 取代 fenced_code，并提供 mermaid 自定义围栏
  # 必须用 fence_div_format：mermaid 读取元素 innerHTML，fence_code_format 的 <code> 包裹会导致解析失败
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - codehilite
  - toc:
      permalink: true

extra_css:
  - assets/custom.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.9.0/dist/mermaid.min.js
  - assets/mermaid-init.js
